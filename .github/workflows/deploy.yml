name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Resolve site address
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
          CUSTOM_SITE_URL: ${{ vars.SITE_URL }}
          CUSTOM_BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          if [[ -n "$CUSTOM_SITE_URL" ]]; then
            echo "SITE_URL=${CUSTOM_SITE_URL%/}" >> "$GITHUB_ENV"
            echo "BASE_PATH=${CUSTOM_BASE_PATH:-/}" >> "$GITHUB_ENV"
          elif [[ "$REPOSITORY" == "$OWNER.github.io" ]]; then
            echo "SITE_URL=https://${OWNER}.github.io" >> "$GITHUB_ENV"
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://${OWNER}.github.io/${REPOSITORY}" >> "$GITHUB_ENV"
            echo "BASE_PATH=/${REPOSITORY}" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Verify optimized images and deployment paths
        run: npm run test:images

      - name: Verify article videos and deployment paths
        run: npm run test:videos

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
